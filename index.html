<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Магазин</title>
    <link rel="stylesheet" href="css/style.css">
    <script>
        const l = document.createElement('link');
        l.rel = 'stylesheet';
        l.href = 'https://' + 'cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css';
        document.head.appendChild(l);
    </script>
</head>

<body>

    <div class="container mt-4">
        <h1>Магазин / Курсы валют</h1>
    </div>

    <script>
        [
            'cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js',
            'cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.all.min.js',
            'cdn.jsdelivr.net/npm/list.js@2.3.1/dist/list.min.js',

            'js/main.js'
        ].forEach(src => {
            const s = document.createElement('script');
            s.src = src.startsWith('js/') ? src : 'https://' + src;
            s.async = false;
            document.body.appendChild(s);
        });
    </script>
</body>

</html>
